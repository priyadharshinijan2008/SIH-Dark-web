version: '3.8'

services:
  # 1. Full-Stack Web App (Vite + Express Backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgres://soc_user:soc_password@postgres:5432/soc_threat_intel
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=soc_password_neo4j
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - postgres
      - neo4j
      - ai-service

  # 2. Relational Database (PostgreSQL)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soc_user
      POSTGRES_PASSWORD: soc_password
      POSTGRES_DB: soc_threat_intel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  # 3. Graph Database (Neo4j)
  neo4j:
    image: neo4j:5.18-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/soc_password_neo4j
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4jdata:/data

  # 4. Python AI Microservice (FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

volumes:
  pgdata:
  neo4jdata:
